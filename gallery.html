<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <header style="text-align:center; padding:20px;">
        <h1>Farm Gallery</h1>
        <p><i>Smart Farming • Healthy Crops • Efficient Irrigation</i></p>
    </header>

    <main>
        <div class="gallery-grid">
            <figure class="gallery-item">
                <a href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Sugarcane_on_the_field.jpg" target="_blank">
                    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Sugarcane_on_the_field.jpg"
                         alt="Healthy Sugarcane Crop" title="Healthy Sugarcane Crop">
                </a>
                <figcaption><b>Healthy Sugarcane Crop</b><br><small>Healthy and well-grown sugarcane field</small></figcaption>
            </figure>

            <figure class="gallery-item">
                <a href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Drip_irrigation_(2552390830).jpg" target="_blank">
                    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Drip_irrigation_(2552390830).jpg"
                         alt="Drip Irrigation System" title="Drip Irrigation System">
                </a>
                <figcaption><b>Drip Irrigation System</b><br><small>Efficient water delivery to crops</small></figcaption>
            </figure>

            <figure class="gallery-item">
                <a href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Soil_moisture_sensor.JPG" target="_blank">
                    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Soil_moisture_sensor.JPG"
                         alt="Soil Moisture Sensor" title="Soil Moisture Sensor">
                </a>
                <figcaption><b>Soil Moisture Sensor</b><br><small>Measures moisture present in the soil</small></figcaption>
            </figure>

            <figure class="gallery-item">
                <a href="https://commons.wikimedia.org/wiki/Special:Redirect/file/Weather_Station_2015.jpg" target="_blank">
                    <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Weather_Station_2015.jpg"
                         alt="Weather Monitoring Station" title="Weather Monitoring Station">
                </a>
                <figcaption><b>Weather Monitoring Station</b><br><small>Monitors weather conditions for irrigation</small></figcaption>
            </figure>
        </div>
    </main>

    <footer>Smart Irrigation for a Sustainable Future</footer>
</body>
</html>
